name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write  # Required for OIDC
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26.8.1'
          registry-url: 'https://registry.npmjs.org'

      - name: Run semantic-release
        id: semantic_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npx semantic-release

      - name: Publish Cloud Copilot package alias
        if: steps.semantic_release.outputs.published == 'true'
        uses: act-security-labs/dual-npm-publish-action@main
        with:
          package-name: '@cloud-copilot/publishing'
          version: ${{ steps.semantic_release.outputs.version }}


